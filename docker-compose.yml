# ==============================================================================
# Docker Compose - Environnement local Lafiya
# Conformité CDC (§4.1, §4.2, §14.1) :
# - Redis  : déduplication wamid 7j, file Taskiq, verrous (local)
# - Qdrant : base vectorielle locale pour dev (port 6333)
#            En prod : remplacer par Qdrant Cloud (QDRANT_URL dans .env)
# - MongoDB : hébergé sur MongoDB Atlas (cloud)
# ==============================================================================

services:
  redis:
    image: redis:8-alpine
    container_name: lafiya_redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  qdrant:
    image: qdrant/qdrant:latest
    container_name: lafiya_qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"   # REST API + Dashboard UI
      - "6334:6334"   # gRPC
    volumes:
      - qdrant_data:/qdrant/storage
    environment:
      - QDRANT__SERVICE__HTTP_PORT=6333
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:6333/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  redis_data:
  qdrant_data:
